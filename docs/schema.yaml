  /api/airport/flights/:
    get:
      operationId: airport_flights_list
      parameters:
      - in: query
        name: available
        schema:
          type: boolean
        description: true selects flights with free seats; false selects sold-out
          flights. Omit to include both. Provide one value; repeated parameters return
          HTTP 400.
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: UTC departure date (YYYY-MM-DD). Provide one value; repeated
          parameters return HTTP 400.
      - in: query
        name: destination
        schema:
          type: integer
          minimum: 1
        description: Destination airport ID. Provide one value; repeated parameters
          return HTTP 400.
      - in: query
        name: ordering
        schema:
          enum:
          - departure_time
          - -departure_time
          type: string
          default: departure_time
          minLength: 1
        description: |-
          Departure time ascending or descending; equal departure times always use ascending IDs. Provide one value; repeated parameters return HTTP 400.

          * `departure_time` - departure_time
          * `-departure_time` - -departure_time
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query

    AirplaneRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        rows:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        seats_in_row:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64

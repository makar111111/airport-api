<svg xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:1420px" viewBox="0 0 1420 1020">
<rect width="1420" height="1020" fill="#f1f5f9"/>
<style>text{font-family:Arial,sans-serif}.field{font-size:15px;fill:#334155}.label{font-size:13px;fill:#475569}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<text x="50" y="48" font-size="30" font-weight="700" fill="#0f172a">Airport API</text>
<text x="50" y="78" font-size="16" fill="#64748b">Database structure · Django REST Framework · PostgreSQL</text>
<path d="M295 220 H390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="305" y="205">1 : many</text>
<path d="M640 240 H680 V380 H730" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="654" y="285">1 : many</text>
<path d="M865 170 V290" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="880" y="230">many : many</text>
<path d="M1090 250 H1045 V390 H1000" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="1028" y="335">1 : many</text>
<path d="M1225 470 V370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="1240" y="420">1 : many</text>
<path d="M295 770 H390" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="307" y="753">1 : many</text>
<path d="M640 770 H730" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="652" y="753">1 : many</text>
<path d="M865 562 V700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text class="label" x="880" y="635">1 : many</text>
<rect x="50" y="140" width="245" height="144" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M60 140 H285 Q295 140 295 150 V182 H50 V150 Q50 140 60 140" fill="#0f172a"/>
<text x="66" y="168" fill="white" font-size="18" font-weight="700">Airport</text>
<text class="field" x="66" y="208">PK  id: bigint</text>
<text class="field" x="66" y="236">name: varchar(255)</text>
<text class="field" x="66" y="264">closest_big_city: varchar(255)</text>
<rect x="390" y="140" width="250" height="200" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M400 140 H630 Q640 140 640 150 V182 H390 V150 Q390 140 400 140" fill="#0f172a"/>
<text x="406" y="168" fill="white" font-size="18" font-weight="700">Route</text>
<text class="field" x="406" y="208">PK  id: bigint</text>
<text class="field" x="406" y="236">FK  source_id: Airport</text>
<text class="field" x="406" y="264">FK  destination_id: Airport</text>
<text class="field" x="406" y="292">distance: positive integer</text>
<text class="field" x="406" y="320">CHECK source != destination</text>
<rect x="730" y="30" width="270" height="144" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M740 30 H990 Q1000 30 1000 40 V72 H730 V40 Q730 30 740 30" fill="#0f172a"/>
<text x="746" y="58" fill="white" font-size="18" font-weight="700">Crew</text>
<text class="field" x="746" y="98">PK  id: bigint</text>
<text class="field" x="746" y="126">first_name: varchar(255)</text>
<text class="field" x="746" y="154">last_name: varchar(255)</text>
<rect x="730" y="290" width="270" height="256" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M740 290 H990 Q1000 290 1000 300 V332 H730 V300 Q730 290 740 290" fill="#0f172a"/>
<text x="746" y="318" fill="white" font-size="18" font-weight="700">Flight</text>
<text class="field" x="746" y="358">PK  id: bigint</text>
<text class="field" x="746" y="386">FK  route_id: Route</text>
<text class="field" x="746" y="414">FK  airplane_id: Airplane</text>
<text class="field" x="746" y="442">departure_time: timestamptz</text>
<text class="field" x="746" y="470">arrival_time: timestamptz</text>
<text class="field" x="746" y="498">M:N crew via flight_crew</text>
<text class="field" x="746" y="526">CHECK arrival &gt; departure</text>
<rect x="1090" y="130" width="270" height="228" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M1100 130 H1350 Q1360 130 1360 140 V172 H1090 V140 Q1090 130 1100 130" fill="#0f172a"/>
<text x="1106" y="158" fill="white" font-size="18" font-weight="700">Airplane</text>
<text class="field" x="1106" y="198">PK  id: bigint</text>
<text class="field" x="1106" y="226">name: varchar(255)</text>
<text class="field" x="1106" y="254">rows: positive integer</text>
<text class="field" x="1106" y="282">seats_in_row: positive integer</text>
<text class="field" x="1106" y="310">FK  airplane_type_id: AirplaneType</text>
<text class="field" x="1106" y="338">image: optional file path</text>
<rect x="1090" y="470" width="270" height="116" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M1100 470 H1350 Q1360 470 1360 480 V512 H1090 V480 Q1090 470 1100 470" fill="#0f172a"/>
<text x="1106" y="498" fill="white" font-size="18" font-weight="700">AirplaneType</text>
<text class="field" x="1106" y="538">PK  id: bigint</text>
<text class="field" x="1106" y="566">name: unique varchar(255)</text>
<rect x="50" y="700" width="245" height="172" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M60 700 H285 Q295 700 295 710 V742 H50 V710 Q50 700 60 700" fill="#0f172a"/>
<text x="66" y="728" fill="white" font-size="18" font-weight="700">User</text>
<text class="field" x="66" y="768">PK  id: bigint</text>
<text class="field" x="66" y="796">email: unique email</text>
<text class="field" x="66" y="824">password: hashed</text>
<text class="field" x="66" y="852">is_staff, is_active, ...</text>
<rect x="390" y="700" width="250" height="144" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M400 700 H630 Q640 700 640 710 V742 H390 V710 Q390 700 400 700" fill="#0f172a"/>
<text x="406" y="728" fill="white" font-size="18" font-weight="700">Order</text>
<text class="field" x="406" y="768">PK  id: bigint</text>
<text class="field" x="406" y="796">FK  user_id: User</text>
<text class="field" x="406" y="824">created_at: timestamptz</text>
<rect x="730" y="700" width="270" height="200" rx="10" fill="white" stroke="#cbd5e1"/>
<path d="M740 700 H990 Q1000 700 1000 710 V742 H730 V710 Q730 700 740 700" fill="#0f172a"/>
<text x="746" y="728" fill="white" font-size="18" font-weight="700">Ticket</text>
<text class="field" x="746" y="768">PK  id: bigint</text>
<text class="field" x="746" y="796">FK  order_id: Order</text>
<text class="field" x="746" y="824">FK  flight_id: Flight</text>
<text class="field" x="746" y="852">row, seat: positive integer</text>
<text class="field" x="746" y="880">UNIQUE (flight_id, row, seat)</text>
<text x="50" y="984" font-size="14" fill="#64748b">PK = primary key   ·   FK = foreign key   ·   Rows and seats are numbered from 1   ·   All times use UTC</text>
</svg>

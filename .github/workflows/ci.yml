name: API checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: airport
          POSTGRES_USER: airport
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airport -d airport"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-key-not-for-deployment
      DB_ENGINE: postgres
      POSTGRES_DB: airport
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --settings=config.test_settings --noinput
      - run: python manage.py spectacular --validate --fail-on-warn
